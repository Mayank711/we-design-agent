<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../styles.css" />
  <style>
    body { margin: 0; padding: 24px; background: var(--surface-page); font-family: var(--font-display); }
    .grid { display: flex; flex-direction: column; gap: 20px; max-width: 440px; }
    .label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
    img { width: 24px; height: 24px; }
  </style>
</head>
<body>
  <div id="root" class="grid"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { SegmentedTabs, BottomNav } = window.WheelsEyeLoadsDesignSystem_985cfc;
    const I = (p) => <img src={p} alt="" />;
    function Demo() {
      const [tab, setTab] = React.useState('new');
      const [nav, setNav] = React.useState('loads');
      return (
        <>
          <div>
            <div className="label">Segmented tabs</div>
            <SegmentedTabs
              tabs={[{ id: 'new', label: 'New Loads' }, { id: 'mine', label: 'My Loads' }]}
              active={tab} onChange={setTab}
            />
          </div>
          <div>
            <div className="label">Bottom navigation</div>
            <div style={{ borderRadius: 12, overflow: 'hidden', border: '1px solid var(--border-card)' }}>
              <BottomNav
                active={nav} onChange={setNav}
                items={[
                  { id: 'loads', label: 'Loads', icon: I('../../assets/icons/truck-outlined.svg'), activeIcon: I('../../assets/icons/truck-filled.svg') },
                  { id: 'lanes', label: 'Lanes', icon: I('../../assets/icons/lanes-outlined.svg'), activeIcon: I('../../assets/icons/lanes-filled.svg') },
                  { id: 'help', label: 'Help', icon: I('../../assets/icons/help-outlined.svg'), activeIcon: I('../../assets/icons/help-filled.svg') },
                  { id: 'home', label: 'Home', icon: I('../../assets/icons/home-outlined.svg'), activeIcon: I('../../assets/icons/home-filled.svg') },
                ]}
              />
            </div>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
