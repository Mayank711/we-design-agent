<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; padding: 28px; font-family: var(--font-display); background: #fff; }
    .row { display: flex; gap: 40px; align-items: center; flex-wrap: wrap; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .lab { font-size: 11px; color: var(--text-muted); font-family: var(--font-secondary); }
    .dark { background: var(--we-green-header); border-radius: 12px; padding: 18px 22px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="cell"><img src="../assets/logos/wheelseye-mark.svg" width="56" height="56" alt="WheelsEye mark" /><span class="lab">mark</span></div>
    <div class="cell"><div class="dark"><img src="../assets/logos/wheelseye-mark-rounded.svg" width="52" height="52" alt="rounded mark" /></div><span class="lab">rounded / on dark</span></div>
    <div class="cell"><img src="../assets/logos/wheelseye-wordmark.svg" height="34" alt="WheelsEye" /><span class="lab">wordmark</span></div>
  </div>
</body>
</html>
