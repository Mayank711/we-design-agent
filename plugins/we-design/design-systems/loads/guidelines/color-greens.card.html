<!-- @dsCard group="Colors" viewport="700x150" name="Brand greens" subtitle="Primary action, success, loading point — the WheelsEye signature" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; padding: 20px; font-family: var(--font-display); background: #fff; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .sw { width: 120px; }
    .chip { height: 56px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.06); }
    .name { font-size: 12px; font-weight: 600; color: var(--text-body); margin-top: 6px; }
    .hex { font-size: 11px; color: var(--text-muted); font-family: var(--font-secondary); }
  </style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--we-green-primary)"></div><div class="name">primary</div><div class="hex">#2EA750</div></div>
    <div class="sw"><div class="chip" style="background:var(--we-green-600)"></div><div class="name">600 / press</div><div class="hex">#248E28</div></div>
    <div class="sw"><div class="chip" style="background:var(--we-green-700)"></div><div class="name">700</div><div class="hex">#207538</div></div>
    <div class="sw"><div class="chip" style="background:var(--we-green-header)"></div><div class="name">header</div><div class="hex">#2F663C</div></div>
    <div class="sw"><div class="chip" style="background:var(--we-green-tint);"></div><div class="name">tint</div><div class="hex">#E7F4E8</div></div>
  </div>
</body>
</html>
