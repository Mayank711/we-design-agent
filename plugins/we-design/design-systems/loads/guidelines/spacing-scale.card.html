<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid; 16px is the default gutter" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; padding: 24px; font-family: var(--font-display); background: #fff; }
    .row { display: flex; gap: 20px; align-items: flex-end; }
    .item { text-align: center; }
    .bar { background: var(--we-green-primary); border-radius: 4px; width: 100%; }
    .lab { font-size: 12px; font-weight: 600; margin-top: 8px; }
    .px { font-size: 11px; color: var(--text-muted); font-family: var(--font-secondary); }
  </style>
</head>
<body>
  <div class="row">
    <div class="item" style="width:24px"><div class="bar" style="height:4px"></div><div class="lab">1</div><div class="px">4</div></div>
    <div class="item" style="width:24px"><div class="bar" style="height:8px"></div><div class="lab">2</div><div class="px">8</div></div>
    <div class="item" style="width:24px"><div class="bar" style="height:12px"></div><div class="lab">3</div><div class="px">12</div></div>
    <div class="item" style="width:28px"><div class="bar" style="height:16px"></div><div class="lab">4</div><div class="px">16</div></div>
    <div class="item" style="width:28px"><div class="bar" style="height:20px"></div><div class="lab">5</div><div class="px">20</div></div>
    <div class="item" style="width:32px"><div class="bar" style="height:24px"></div><div class="lab">6</div><div class="px">24</div></div>
    <div class="item" style="width:36px"><div class="bar" style="height:32px"></div><div class="lab">8</div><div class="px">32</div></div>
    <div class="item" style="width:40px"><div class="bar" style="height:40px"></div><div class="lab">10</div><div class="px">40</div></div>
  </div>
</body>
</html>
