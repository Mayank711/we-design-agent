<!-- @dsCard group="Type" viewport="700x230" name="Baloo 2 — display & UI" subtitle="Primary typeface; rounded, high-legibility for the road" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; padding: 24px; font-family: var(--font-display); background: #fff; color: var(--text-body); }
    .stack { display: flex; flex-direction: column; gap: 14px; }
    .spec { display: flex; align-items: baseline; gap: 16px; }
    .meta { font-family: var(--font-secondary); font-size: 11px; color: var(--text-muted); width: 130px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="stack">
    <div class="spec"><span class="meta">Display · 30 / 700</span><span style="font-size:30px;font-weight:700;line-height:1.4;color:var(--we-violet-deep)">Find loads near you</span></div>
    <div class="spec"><span class="meta">H1 · 24 / 600</span><span style="font-size:24px;font-weight:600">Jaipur → Surat</span></div>
    <div class="spec"><span class="meta">Title · 18 / 500</span><span style="font-size:18px;font-weight:500">32 ft Multi-axle · Full load</span></div>
    <div class="spec"><span class="meta">Body · 16 / 400</span><span style="font-size:16px;font-weight:400">21 Tonnes of cement, loading today</span></div>
    <div class="spec"><span class="meta">Caption · 14 / 400</span><span style="font-size:14px;font-weight:400;color:var(--text-muted)">Posted 12 minutes ago</span></div>
  </div>
</body>
</html>
