<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WheelsEye Loads — Activation Rewards</title>
  <link rel="stylesheet" href="../../styles.css" />
  <style>
    body { margin: 0; background: #eef0f5; font-family: var(--font-display); }
    * { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    @keyframes confetti-fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(820px) rotate(720deg); opacity: 0; }
    }
    @keyframes truck-bob {
      0%, 100% { transform: translate(-50%, -50%) translateY(0); }
      50%      { transform: translate(-50%, -50%) translateY(-5px); }
    }
    @keyframes amount-shine {
      0%   { background-position: 220% 0; }
      100% { background-position: -20% 0; }
    }
    @keyframes amount-glow {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.18); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#2F663C"/>
      <text x="50" y="44" font-size="20" font-weight="800" fill="#FFD24A" text-anchor="middle" font-family="sans-serif">₹3500</text>
      <text x="50" y="64" font-size="9" fill="#CFEBD3" text-anchor="middle" font-family="sans-serif">इनाम</text>
    </svg>
  </template>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="variations.jsx"></script>
  <script type="text/babel">
    const App = window.RewardsMilestoneApp;
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
